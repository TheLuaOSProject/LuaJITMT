name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x86_64 build/run
    runs-on: ubuntu-24.04
    env:
      LUA: luajit
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential luajit
      - name: Build, run, and test Linux platform
        run: |
          tools/ci/platform_build.sh linux-x86_64
      - name: Compare selected benchmarks against stock LuaJIT
        env:
          LJ_BENCH_STOCK_BIN: /usr/bin/luajit
          LJ_BENCH_STOCK_FILTERS: arith_loop fib30 tab_hash_write alloc_tables closures_upval
          LJ_BENCH_STOCK_MAX: "100"
          LJ_BENCH_STOCK_TIMEOUT: 60s
          BENCH_SCALE: "0.001"
        run: |
          tools/ci/lua_test.sh m9_bench_stock_compare

  macos:
    name: macOS x86_64 build/run
    runs-on: macos-26-intel
    env:
      LUA: luajit
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build tools
        run: |
          if ! command -v luajit >/dev/null 2>&1; then
            brew install luajit
          fi
      - name: Build, run, and test macOS platform
        run: |
          tools/ci/platform_build.sh macos-x86_64

  windows-ucrt:
    name: Windows x86_64 UCRT build/run
    runs-on: ubuntu-24.04
    container: debian:trixie
    env:
      LUA: luajit
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates git luajit make \
            binutils-mingw-w64-ucrt64 gcc-mingw-w64-ucrt64 mingw-w64 \
            wine wine64
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build, run, and test Windows UCRT platform
        run: |
          mkdir -p "$PWD/.ci-home" "$PWD/.wine"
          export HOME="$PWD/.ci-home"
          export WINEPREFIX="$PWD/.wine"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tools/ci/platform_build.sh windows-x86_64-ucrt
