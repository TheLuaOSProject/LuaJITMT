name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x86_64 build/run
    runs-on: ubuntu-24.04
    env:
      LUA: luajit
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential luajit
      - name: Build, run, and test Linux platform
        run: |
          tools/ci/platform_build.sh linux-x86_64
      - name: Stock compatibility and shared-heap runtime tests
        run: tools/ci/linux_x64_shared.sh
      - name: Check shared execution with VM and recorder assertions
        run: |
          make -C src clean
          checks='-DLUA_USE_ASSERT -DLJ_GC2_TEST_HELPERS -DLJ_TAB_TEST_HELPERS'
          make -C src -j2 CC=clang XCFLAGS="$checks" \
            TARGET_CFLAGS=-ftrivial-auto-var-init=pattern BUILDMODE=static
          tools/ci/linux_x64_shared.sh
          clang -O2 -mcx16 $checks -Isrc tests/t-lockless-progress-metrics.c \
            src/libluajit.a -lm -ldl -pthread -o "$RUNNER_TEMP/lj-progress"
          timeout 30 "$RUNNER_TEMP/lj-progress"
      - name: Check the Linux runtime with UndefinedBehaviorSanitizer
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          make -C src clean
          make -C src -j2 CC=clang BUILDMODE=static \
            XCFLAGS='-DLUA_USE_ASSERT -DLUA_USE_APICHECK' \
            TARGET_CFLAGS='-fsanitize=undefined -fno-omit-frame-pointer' \
            TARGET_LDFLAGS=-fsanitize=undefined
          tools/ci/linux_x64_shared.sh

  macos:
    name: macOS x86_64 build/run
    runs-on: macos-26-intel
    env:
      LUA: luajit
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build tools
        run: |
          if ! command -v luajit >/dev/null 2>&1; then
            brew install luajit
          fi
      - name: Build, run, and test macOS platform
        run: |
          tools/ci/platform_build.sh macos-x86_64

  windows-ucrt:
    name: Windows x86_64 UCRT build/run
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Allow sparse checkout around reserved benchmark paths
        shell: pwsh
        run: |
          git config --global core.protectNTFS false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          # Git for Windows refuses to materialize paths with reserved DOS
          # device names. The benchmark-only aux/ tree is not needed by the
          # native Windows platform build/run smoke, so exclude it at checkout
          # while keeping the rest of the source tree complete.
          sparse-checkout: |
            /*
            !/aux/
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            mingw-w64-ucrt-x86_64-gcc
      - name: Build, run, and test Windows UCRT platform
        run: |
          tools/ci/platform_build.sh windows-x86_64-ucrt
