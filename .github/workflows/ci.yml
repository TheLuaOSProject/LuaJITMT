name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stock-semantics:
    name: Stock Lua/LuaJIT semantics
    runs-on: ubuntu-24.04
    env:
      LUA: lua5.4
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential lua5.4
      - name: Run stock suite matrix
        run: |
          LJ_TEST_DISABLE_BUILD_CACHE=1 \
            tools/ci/lua_test.sh m0_matrix
      - name: Run stock compatibility sentinels
        run: |
          LJ_TEST_DISABLE_BUILD_CACHE=1 \
            tools/ci/lua_test.sh \
              m5_stock_api_surface \
              m5_bcdump_compat \
              m5_cell_ops
